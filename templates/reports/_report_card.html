{% load i18n %}
<a class="prop-card" href="{% url url %}" style="text-decoration:none">
  <div class="cover" style="height:74px">
    <svg class="art" viewBox="0 0 320 74" preserveAspectRatio="none"><rect width="320" height="74" fill="url(#rg)"/>
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#123447"/><stop offset="100%" stop-color="#0d7d8c"/></linearGradient></defs>
      <circle cx="292" cy="10" r="38" fill="#fff" opacity=".06"/></svg>
    <div class="title" style="display:flex;gap:10px;align-items:center">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#e0a03c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ icon }}"/></svg>
      <b>{{ name }}</b>
    </div>
  </div>
  <div class="meta" style="display:block"><p class="muted" style="margin:0;font-size:12.5px">{{ desc }}</p></div>
</a>
