{% load i18n %}{# The round chat button on every page, and the pop-up chat it opens. #}
<button type="button" class="chat-fab no-print" data-chat-toggle aria-controls="chat-panel"
        aria-expanded="false" aria-label="{% trans 'Open the assistant' %}" title="{% trans 'Assistant' %}">
  <svg class="chat-fab-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.3A8 8 0 1121 12zM8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>
  <svg class="chat-fab-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<section class="chat-panel no-print" id="chat-panel" hidden aria-label="{% trans 'Assistant' %}">
  <header class="chat-panel-head">
    <strong>{% trans "Assistant" %}</strong>
    <a class="btn sm" href="{% url 'assistant:chat' %}">{% trans "Full screen" %}</a>
    <button type="button" class="icon-btn" data-chat-toggle aria-label="{% trans 'Close the assistant' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  {% url 'assistant:opening' as opening_url %}
  {% include "assistant/_chat.html" with opening_url=opening_url %}
</section>
